[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "musk-sentiment"
version = "0.1.0"
description = "Reproducible ELEC3544 social sentiment research foundation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3", "pandas>=2.2,<3", "yfinance>=0.2.54,<2",
  "exchange-calendars>=4.5,<5", "httpx>=0.27,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
research = ["scikit-learn>=1.5,<2", "scipy>=1.14,<2", "statsmodels>=0.14,<1", "matplotlib>=3.9,<4"]
[project.scripts]
musk-sentiment = "musk_sentiment.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
