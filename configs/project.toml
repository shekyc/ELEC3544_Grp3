# Candidate universe, not a final research selection. Extend after coverage/relevance audit.
[research]
start = "2020-01-01"
end = "2022-01-01" # exclusive; two complete years
interval = "1h"
market_start = "2019-01-01" # pre-event estimation history, not an expanded post scope
market_end = "2022-02-01" # outcomes for late-December posts
provider = "alpaca"
hourly_horizons = [1, 3, 6, 24]
daily_horizons = [1, 3, 5]
estimation_bars = 120
min_estimation_bars = 60
validation_start = "2021-01-01"
test_start = "2021-07-01"
seed = 3544

